# Perfil reproducible de arduino-cli (>= 1.1): nucleo y bibliotecas fijados.
#   arduino-cli compile --profile nodo_b_esp32 BioIoT_NodeB_ESP32
profiles:
  nodo_b_esp32:
    notes: Nodo B - ESP32 WROOM (ESP32 Dev Module), sensores I2C en GPIO21/22, NVS
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - BH1750 (1.3.0)
      - dir: ../libraries/BioIoTCommon
