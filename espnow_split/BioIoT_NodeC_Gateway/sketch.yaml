# Perfil reproducible de arduino-cli (>= 1.1): nucleo y bibliotecas fijados.
#   arduino-cli compile --profile nodo_c BioIoT_NodeC_Gateway
profiles:
  nodo_c:
    notes: Nodo C - ESP32 WROOM (ESP32 Dev Module), particion "Minimal SPIFFS (1.9MB APP with OTA)"
    fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - PubSubClient (2.8)
      - Azure SDK for C (1.1.8)
      - WiFiManager (2.0.17)
      - dir: ../libraries/BioIoTCommon
